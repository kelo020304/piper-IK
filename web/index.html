<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piper IK Studio</title><link rel="stylesheet" href="/static/style.css"><script type="importmap">{"imports":{"three":"/static/vendor/three.module.js"}}</script></head><body>
<header><a class="brand" href="/">PIPER IK</a><div class="segmented" aria-label="IK 模式"><button data-mode="pin" class="active">Pinocchio</button><button data-mode="rl">RL</button></div><nav><a href="/sim-guide/" target="_blank">启动</a><a id="sim-frame" href="/api/simulator/frame" target="_blank" hidden>仿真截图</a><a href="/hardware-guide/" target="_blank">真机命令</a><a href="/report/" target="_blank">报告</a></nav><span id="connection" class="badge">连接中</span></header>
<main><div class="workspace"><section class="scene-card"><div id="viewport" tabindex="0" aria-label="机械臂三维视图，点击后接管键盘"><div id="viewer-status">正在载入模型…</div><div class="scene-label"><span class="dot"></span><span id="execution">仿真 · 运动学</span></div><div class="legend">当前：短实线 · 目标：长虚线<br><i class="axis-x"></i>X <i class="axis-y"></i>Y <i class="axis-z"></i>Z</div><div class="viewer-hint">鼠标旋转 · 滚轮缩放</div></div><div class="metrics"><div><small>位置误差</small><strong id="position-error">—</strong><span>mm</span></div><div><small>姿态误差</small><strong id="rotation-error">—</strong><span>°</span></div><div><small>控制周期耗时</small><strong id="solver-ms">—</strong><span>ms</span></div></div></section>
<aside><section class="card hardware"><div class="card-title"><h2>机械臂</h2><span id="hardware-status" class="tag lock">已锁定</span></div><div class="hw-buttons"><button data-hardware="connect" disabled>连接</button><button data-hardware="arm" disabled>使能</button><button data-hardware="home" disabled>回零</button><button data-hardware="disable" disabled>返回安全位置并失能</button><button data-hardware="stop" disabled>立即停止</button><button data-hardware="clear" title="清除软件故障及停止锁存；不会使能或运动" disabled>清除故障</button><button data-hardware="disconnect" disabled>断开</button></div><p id="hardware-note">本次仅仿真</p><details><summary>安全位置 · 首次使能姿态</summary><div id="safe-joints">尚未记录</div></details></section><section class="card"><div class="card-title"><h2>键盘微调</h2><span class="tag">基座坐标系</span></div><div class="steps"><label>平移步长<select id="step-mm"><option>0.1</option><option>0.5</option><option selected>1</option><option>2</option><option>5</option></select><span>mm</span></label><label>旋转步长<select id="step-deg"><option>0.1</option><option selected>0.5</option><option>1</option><option>2</option><option>5</option></select><span>°</span></label></div>
<div class="key-layout"><div class="wasd"><span></span><button data-key="w">W<small>前</small></button><span></span><button data-key="a">A<small>左</small></button><button data-key="s">S<small>后</small></button><button data-key="d">D<small>右</small></button></div><div class="height"><button data-key="ArrowUp">↑<small>升</small></button><button data-key="ArrowDown">↓<small>降</small></button></div></div>
<div class="rotations"><div><button data-key="q">Q</button><button data-key="e">E</button><span>绕 Z</span></div><div><button data-key="z">Z</button><button data-key="c">C</button><span>绕 Y</span></div><div><button data-key="r">R</button><button data-key="f">F</button><span>绕 X</span></div></div>
<p id="owner-status" class="message">未接管</p><button id="claim" class="primary">接管键盘</button><button id="pause" class="stop">暂停 <kbd>Space</kbd></button><p id="message" class="message" role="status">连接后，点击接管键盘。</p><div class="minor"><button id="reset">重置仿真</button><span>切窗口继续追踪 · 断线停止</span></div></section>
</aside></div>
<section class="pose card"><div class="card-title"><h2>末端位姿</h2><span class="tag">TCP 默认 link6 原点</span></div><div class="pose-grid"><div><small></small><b>X · mm</b><b>Y · mm</b><b>Z · mm</b><b>Rx · °</b><b>Ry · °</b><b>Rz · °</b></div><div id="actual-pose"><small>当前</small></div><div id="target-pose"><small>目标</small></div></div><details><summary>跟踪详情 · 实测 / 命令关节角</summary><div id="joints"></div><p id="tracking-details"></p></details></section>
</main><script type="module" src="/static/app.js"></script></body></html>
