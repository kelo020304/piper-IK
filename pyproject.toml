[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper_ik"
version = "1.1.0"
description = "IK for any URDF serial arm (Pinocchio, bounded damped least squares) with the data_viewer real-arm replay chain for FastUMI actions; Piper + UMI gripper bundled"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20", "scipy>=1.6", "pin==3.7.0"]

[project.optional-dependencies]
hardware = ["piper_sdk==0.6.1"]
test = ["pytest>=7", "pyarrow"]

# This folder is the package itself: copy it next to your code and `import piper_ik`, or pip install it.
[tool.setuptools]
package-dir = {"piper_ik" = "."}
packages = ["piper_ik"]

[tool.setuptools.package-data]
piper_ik = ["model/*.urdf", "model/*.json", "model/piper_umi_models/**/*", "README.md", "AGENTS.md", "THIRD_PARTY.md", "LICENSE"]
